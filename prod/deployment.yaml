apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-deployment
  template:
    metadata:
      labels:
        app: production-deployment
    spec:
      containers:
      - name: production-deployment
        image: us-east4-docker.pkg.dev/qwiklabs-gcp-02-f3d3e26c1de4/my-repository/sample-app:v1.0
        ports:
        - containerPort: 8080
